# VTC 限流与回源协议映射
# 必须放在 http {} 上下文 —— 安装到 /etc/nginx/conf.d/00-vtc-limits.conf
# 由 deploy/apply-p0.sh 负责拷贝。

# 登录：每 IP 每分钟 10 次（配合 burst 允许突发 5 次）
limit_req_zone $binary_remote_addr zone=vtc_login:1m rate=10r/m;

# 访问上报：每 IP 每分钟 60 次
limit_req_zone $binary_remote_addr zone=vtc_visit:1m rate=60r/m;

# WebShell 终端握手：每 IP 每分钟 30 次（升级成 WebSocket 后不再受限）
limit_req_zone $binary_remote_addr zone=vtc_term:1m rate=30r/m;

# 其它 API 调用：每 IP 每分钟 120 次（正常浏览远低于此，主要压住脚本刷接口）
limit_req_zone $binary_remote_addr zone=vtc_api:1m rate=120r/m;

# Cloudflare 隧道回源会带 X-Forwarded-Proto: https；局域网直连时回落到 $scheme
map $http_x_forwarded_proto $vtc_proto {
    default $scheme;
    https   https;
    http    http;
}

# 只有真正走 HTTPS 时才下发 HSTS（空值不会发送该头）
map $http_x_forwarded_proto $vtc_hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}
