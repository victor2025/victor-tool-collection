# VTC 压缩配置（http 上下文）—— 安装到 /etc/nginx/conf.d/10-vtc-gzip.conf
# 系统默认只压缩 text/html；这里把 CSS / JS / JSON / SVG 也纳进来，
# 对树莓派这种上行带宽有限的设备收益明显。

# 系统 nginx.conf 已在 http 层开启 gzip，这里只补齐类型与参数，避免重复指令报错。
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/atom+xml
    image/svg+xml;
