server {
	listen 8001;
	listen [::]:8001;
	charset utf-8;

	server_name _;

	# ===== 导航页 =====
	root /home/pi/projects/Frontend/victor-tool-collection/nav;
	index index.html;

	location / {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		try_files $uri $uri/ =404;
		add_header Cache-Control "no-cache, must-revalidate";
	}

	# ===== 共享样式资源（新工具与后续迁移用）=====
	location /shared/ {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		alias /home/pi/projects/Frontend/victor-tool-collection/shared/;
		expires 7d;
		add_header Cache-Control "public";
	}

	# ===== 工具：记分板 =====
	location /score-board {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/score-board/dist;
		try_files $uri $uri/ /score-board/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	location /score-board/assets/ {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/score-board/dist/assets/;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location /score-board/fonts/ {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/score-board/dist/fonts/;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# ===== 工具：Base64 编解码 =====
	location /base64 {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/base64/dist;
		try_files $uri $uri/ /base64/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	# ===== 工具：二维码工具 =====
	location /qrcode {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/qrcode/dist;
		try_files $uri $uri/ /qrcode/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	# ===== 工具：JSON 格式化 =====
	location /json-formatter {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/json-formatter/dist;
		try_files $uri $uri/ /json-formatter/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	# ===== 工具：JWT 解码 =====
	location /jwt-decoder {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/jwt-decoder/dist;
		try_files $uri $uri/ /jwt-decoder/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	# ===== 工具：台风观测 =====
	location /typhoon {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/typhoon/dist;
		try_files $uri $uri/ /typhoon/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	# ===== 工具：管理后台 =====
	location /admin {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/admin/dist;
		try_files $uri $uri/ /admin/index.html;
		add_header Cache-Control "no-cache, must-revalidate";
	}

	# ===== 工具：时间戳转换 =====
	location /timestamp {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/timestamp/dist;
		try_files $uri $uri/ /timestamp/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

 
	# ===== 工具：URL 编解码 =====
	location /url-encode {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/url-encode/dist;
		try_files $uri $uri/ /url-encode/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}
	# ===== 工具：正则表达式 =====
	location /regex {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/regex/dist;
		try_files $uri $uri/ /regex/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}


	# ===== 工具：WebShell =====
	location /webshell {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/webshell/dist;
		try_files $uri $uri/ /webshell/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	location /webshell/term/ {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		limit_req zone=vtc_term burst=5 nodelay;
		limit_req_status 429;

		proxy_pass http://127.0.0.1:8022/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $vtc_proto;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}


	# ===== 登录接口：严格限流 =====
	location = /api/login {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		limit_req zone=vtc_login burst=5 nodelay;
		limit_req_status 429;
		client_max_body_size 1m;
		proxy_pass http://127.0.0.1:8003;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $vtc_proto;
	}

	# ===== 访问上报：限流，防刷库 =====
	location = /api/visit {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		limit_req zone=vtc_visit burst=20 nodelay;
		limit_req_status 429;
		client_max_body_size 1m;
		proxy_pass http://127.0.0.1:8003;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $vtc_proto;
	}

	# ===== Go Backend API 代理 =====

	# ===== 工具：乐谱夹 =====
	location /score-library {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/score-library/dist;
		try_files $uri $uri/ /score-library/index.html;
		expires -1;
		add_header Cache-Control "no-cache, must-revalidate";
	}

	# ===== 乐谱文件存储（nginx 静态直出）=====
	location /scores/files/ {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		alias /home/pi/projects/Frontend/victor-tool-collection/data/scores/;
		expires 7d;
		add_header Cache-Control "public";
	}

	location /api/ {
	include /etc/nginx/snippets/vtc-security-headers.conf;
		limit_req zone=vtc_api burst=20 nodelay;
		limit_req_status 429;
		client_max_body_size 50m;
		proxy_pass http://127.0.0.1:8003;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $vtc_proto;
		add_header Cache-Control "no-cache, must-revalidate";
		add_header Access-Control-Allow-Origin *;
	}
	
	# ===== 工具：转义/反转义 =====
	location /escape {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/escape/dist;
		try_files $uri $uri/ /escape/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}

	# ===== 工具：图片混淆 =====
	location /image-obfuscator {
	include /etc/nginx/snippets/vtc-security-headers.conf;
	sub_filter_once off;
	sub_filter '</body>' '<script src="/tracker.js?v=6"></script></body>';
		alias /home/pi/projects/Frontend/victor-tool-collection/tools/image-obfuscator/dist;
		try_files $uri $uri/ /image-obfuscator/index.html;
		expires 1h;
		add_header Cache-Control "public";
	}
}

